name: Publish SuprKandi to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure supported npm CLI
        run: npm install --global npm@latest

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release tag: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag must be ${EXPECTED_TAG}, but got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Publish package to npm using Trusted Publishing
        run: npm publish --access public
