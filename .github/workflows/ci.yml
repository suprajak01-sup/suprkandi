name: SuprKandi CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Windows / Node ${{ matrix.node-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate npm package contents
        run: npm pack --dry-run
